version: 2
updates:
  # App dependencies: one grouped PR per week for minor/patch; majors stay separate for review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # MCP server package (own lockfile).
  - package-ecosystem: npm
    directory: /packages/prgraph-mcp
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Pin and refresh GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
